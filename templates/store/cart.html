<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <style>
        body {
            font-family: Arial;
                background-color: #f4f7f1;
            
        }
        .cart-container {
            width: 80%;
            margin: auto;
            margin-top: 40px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background:  white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }
        img {
            width: 80px;
            border-radius: 8px;
        }
        .remove-btn {
            background: red;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
        }
        .total {
            font-size: 20px;
            margin-top: 20px;
            text-align: right;
        }

        .checkout-btn {
    padding: 12px 25px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(45deg, #00ff84, #1e3902);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
}

.checkout-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px #1e3902;
}

    </style>
</head>
<body>

<div class="cart-container">

    {% if cart_items %}

        {% for item in cart_items %}
            <div class="cart-item">
                <h3>{{ item.product.title }}</h3>
                <p>Price: ₹{{ item.product.price }}</p>
                <p>Quantity: {{ item.quantity }}</p>

                <a href="{% url 'remove_from_cart' item.id %}">
                    <button class="remove-btn">Remove</button>
                </a>
            </div>
        {% endfor %}

        <div class="total">
            <h3>Total Price: ₹{{ total_price }}</h3>
        </div>

        <div class="checkout-section">
            <a href="{% url 'checkout' %}">
                <button class="checkout-btn">Proceed to Checkout</button>
            </a>
        </div>


    {% else %}
        <h2 style="margin-left: 44%;">Your cart is empty</h2>
    {% endif %}

</div>
</body>
</html>
