

<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { 
           
            background: #ffffff;
             overflow-x: hidden;}


/* Heading */
h2{
    text-align: center;
    margin-top: 120px;
    font-size: 32px;
    color: #222;
    letter-spacing: 1px;
}

/* Profile Card */
.profile-box{
    max-width: 420px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    transition: 0.3s;
}

.profile-box:hover{
    transform: translateY(-5px);
}

/* Text Styling */
.profile-box p{
    font-size: 16px;
    color: #444;
    margin-bottom: 15px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

.profile-box strong{
    color: #000;
}

/* Logout Button */
a[href*="login"]{
    display: block;
    width: fit-content;
    margin: 25px auto;
    padding: 12px 35px;
    background: #c5a059;
    color: white;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
}

a[href*="login"]:hover{
    background: #1e3902;
    transform: scale(1.05);
}

/* ===== Responsive ===== */
@media (max-width: 600px){

    h2{
        font-size: 26px;
        margin-top: 90px;
    }

    .profile-box{
        margin: 20px;
        padding: 25px;
    }
}
  nav { 
            position: fixed; top: 0; width: 100%; background: linear-gradient(359deg, #070707, #ff00000f);height: 50px;
            padding: 1.2rem 8%; display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;  backdrop-filter: blur(10px);
        }
        .logo { font-family: 'Playfair Display', serif; color: #ffffffd1; font-size: 1.8rem; text-decoration:none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; font-size: 0.9rem; text-transform: uppercase; }
        .nav-links a:hover { color: #c5a059; }

        .logo-img{
            height: 20px;
            width: 20px;
            border-radius: 50%;
        }


</style>

<nav>
        <a href="home.html" class="logo">SAGTANI CHAI & CO.</a>
        <div class="search-wrapper">
    


        <div class="nav-links" id="nav-actions">
            
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'menu' %}">Menu</a>
            <a href="{% url 'cart' %}">Cart</a>
            <a href="{% url 'order' %}">order</a></nav>
<h2>My Profile</h2>

<div class="profile-box">
    <p><strong>Username:</strong> {{ request.user.username }}</p>
    <p><strong>Email:</strong> {{ request.user.email }}</p>
</div>

<a href="{% url 'login' %}">Logout</a>
