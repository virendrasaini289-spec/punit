<style>
    .search-heading {
    text-align: center;
    margin: 30px 0;
    font-size: 28px;
    color: #333;
}

/* Product Grid */
.product-container {
    display: flex;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    padding: 20px 40px;
}

/* Card */
.product-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: 0.3s ease;
    cursor: pointer;
}

.product-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* Image */
.product-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

/* Info */
.product-info {
    padding: 15px;
}

.product-info h3 {
    margin: 0;
    font-size: 18px;
    color: #222;
}

.product-info p {
    font-size: 14px;
    color: #666;
    margin: 8px 0;
}

.price {
    font-size: 18px;
    font-weight: bold;
    color: #2e7d32;
}

/* No Result */
.no-result {
    text-align: center;
    font-size: 18px;
    color: red;
}

.quick-view-btn{ 
           background:  black;
            color: white;
            padding: 15px 40px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
    margin-top: 20px;
    margin-left:20px;
                    }
.quick-view-btn:hover { background: #1e3902; }           

</style>

<h2 class="search-heading">Search Results</h2>

<div class="product-container">
    {% if products %}
        {% for product in products %}
            <div class="product-card">
                <img src="{{ product.image.url }}" alt="{{ product.title }}">
                
                <div class="product-info">
                    <h3>{{ product.title }}</h3>
                    <p>{{ product.description|truncatewords:12 }}</p>
                    <span class="price">₹{{ product.price }}</span>
                    <a href="{% url 'product_detail' product.id %}">
            <button class="quick-view-btn">view</button>
        </a>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p class="no-result">No product found 😢</p>
    {% endif %}
</div>
